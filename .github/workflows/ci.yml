name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Schema presence
        run: |
          test -f docs/core/db/schema.sql
          test -f docs/core/ARCHITECTURE-LOCKED.md
          test -f docs/core/GO-NO-GO.md
          test -d src
      - name: Schema drift smoke
        run: node scripts/schema-drift-smoke.js
