name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs-phase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs-only phase notice
        run: |
          echo "Implementation/tests deferred to dedicated branch."
          echo "Canonical constitution: docs/core/ARCHITECTURE-LOCKED.md"
          test -f docs/core/ARCHITECTURE-LOCKED.md
          test -f docs/core/GO-NO-GO.md
          test ! -d src
