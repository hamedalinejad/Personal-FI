name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # no cache until package-lock.json is committed
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Schema presence
        run: |
          test -f docs/core/db/schema.sql
          test -f docs/core/ARCHITECTURE-LOCKED.md
          test -f docs/core/GO-NO-GO.md
          test -d src
      - name: Schema drift (strong)
        run: node scripts/schema-drift-test.js
      - name: Field inventory coverage
        run: node scripts/field-inventory-verify.js
